<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121214">
  <title>Punto Community Nederland</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="logo.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Kaartbibliotheek laden met reserve-servers: lukt de eerste niet, dan de volgende.
    window.leafletReady = (function () {
      var bases = [
        "https://unpkg.com/leaflet@1.9.4/dist/",
        "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/",
        "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/",
      ];
      function tryLoad(i, resolve) {
        if (window.L) return resolve(window.L);
        if (i >= bases.length) return resolve(null);
        var css = document.createElement("link");
        css.rel = "stylesheet"; css.href = bases[i] + "leaflet.css";
        document.head.appendChild(css);
        var s = document.createElement("script");
        s.src = bases[i] + "leaflet.js";
        var timer = setTimeout(function () { s.onerror(); }, 8000);
        s.onload = function () { clearTimeout(timer); resolve(window.L || null); };
        s.onerror = function () { clearTimeout(timer); s.onerror = s.onload = null; css.remove(); s.remove(); tryLoad(i + 1, resolve); };
        document.head.appendChild(s);
      }
      return new Promise(function (resolve) { tryLoad(0, resolve); });
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <img src="logo.svg" alt="" class="logo">
    <div class="brand">
      <strong>Punto Community</strong>
      <span>Nederland</span>
    </div>
    <span id="demoBadge" class="demo-badge" hidden>DEMO</span>
  </header>

  <main id="view" class="view"></main>

  <nav id="tabs" class="tabs" hidden>
    <button data-tab="kaart" class="active"><span>🗺️</span>Kaart</button>
    <button data-tab="meets"><span>🏁</span>Meets</button>
    <button data-tab="chat"><span>💬</span>Chat</button>
    <button data-tab="instellingen"><span>⚙️</span>Instellingen</button>
    <button data-tab="beheer" id="tabBeheer" hidden><span>🛠️</span>Beheer</button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
